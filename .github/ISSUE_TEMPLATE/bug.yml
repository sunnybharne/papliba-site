name: Bug report
description: Report a reproducible problem in the current Papliba release.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository contains the public Papliba website. Application bugs belong in sunnybharne/papliba.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Site URL or commit SHA
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include a clear description and the result you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, operating system, Node version, or other relevant details

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs or screenshots after removing private data.
